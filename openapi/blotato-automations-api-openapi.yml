openapi: 3.2.0
info:
  title: Blotato Automations API
  description: Blotato API documentation
  version: 2.0.0
servers:
- url: https://backend.blotato.com
  description: Blotato API Server
tags:
- name: Automations
  description: Endpoints related to DM automations, which send a direct message in response to a comment or message on a connected social account.
paths:
  /v2/dm-automations:
    get:
      summary: List DM automations
      tags:
      - Automations
      description: Lists the current user's DM automations, ordered by creation time (most recent first). Each automation includes run stats for the last 24 hours. Supports cursor-based pagination.
      parameters:
      - schema:
          minimum: 1
          maximum: 250
          default: 50
          type: integer
        in: query
        name: limit
        required: false
        description: Maximum number of DM automations to return. Defaults to 50.
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Opaque cursor returned by a previous call. Pass it to fetch the next page.
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    description: List of DM automations
                    type: array
                    items:
                      type: object
                      properties:
                        accountId:
                          type: string
                        buttons:
                          maxItems: 3
                          type: array
                          items:
                            type: object
                            properties:
                              title:
                                maxLength: 20
                                type: string
                              type:
                                type: string
                                enum:
                                - url
                              url:
                                type: string
                            required:
                            - title
                            - type
                        commentReply:
                          description: Configuration for public replies to comments that triggered the automation.
                          type: object
                          properties:
                            variants:
                              description: Public reply variants, each with a text. One is picked at random for each comment, capped at the platform's comment length. {{mention}} in a text is replaced with a tag of the commenter.
                              minItems: 3
                              maxItems: 6
                              type: array
                              items:
                                type: object
                                properties:
                                  text:
                                    pattern: \S
                                    type: string
                                required:
                                - text
                          required:
                          - variants
                        createdAt:
                          type: string
                        dmMessage:
                          maxLength: 640
                          type: string
                        emailGate:
                          type: object
                          properties:
                            message:
                              minLength: 1
                              maxLength: 640
                              type: string
                          required:
                          - message
                        followGate:
                          type: object
                          properties:
                            buttonTitle:
                              default: I'm following
                              minLength: 1
                              maxLength: 20
                              type: string
                            message:
                              minLength: 1
                              maxLength: 640
                              type: string
                          required:
                          - message
                        id:
                          type: string
                        isActive:
                          type: boolean
                        name:
                          minLength: 1
                          maxLength: 60
                          type: string
                        platform:
                          type: string
                          enum:
                          - facebook
                          - instagram
                        publishedVersionId:
                          type:
                          - string
                          - 'null'
                        target:
                          type: object
                          discriminator:
                            propertyName: targetType
                          oneOf:
                          - type: object
                            properties:
                              pageId:
                                type: string
                              targetType:
                                type: string
                                enum:
                                - facebook
                            required:
                            - pageId
                            - targetType
                          - type: object
                            properties:
                              targetType:
                                type: string
                                enum:
                                - instagram
                            required:
                            - targetType
                        triggers:
                          type: array
                          items:
                            type: object
                            discriminator:
                              propertyName: type
                            oneOf:
                            - type: object
                              properties:
                                id:
                                  type: string
                                isActive:
                                  type: boolean
                                keywords:
                                  type: array
                                  items:
                                    type: string
                                postId:
                                  type:
                                  - string
                                  - 'null'
                                type:
                                  type: string
                                  enum:
                                  - comment-received
                              required:
                              - id
                              - keywords
                              - type
                            - type: object
                              properties:
                                id:
                                  type: string
                                isActive:
                                  type: boolean
                                keywords:
                                  type: array
                                  items:
                                    type: string
                                type:
                                  type: string
                                  enum:
                                  - message-received
                              required:
                              - id
                              - keywords
                              - type
                        updatedAt:
                          type: string
                        webhook:
                          type: object
                          properties:
                            headers:
                              type: object
                              additionalProperties:
                                type: string
                            method:
                              type: string
                              enum:
                              - DELETE
                              - GET
                              - PATCH
                              - POST
                              - PUT
                            url:
                              minLength: 1
                              maxLength: 2048
                              type: string
                          required:
                          - method
                          - url
                        stats:
                          description: Run counts over the last 24 hours, plus when the automation last ran (null if it never ran).
                          type: object
                          properties:
                            completed:
                              type: integer
                            failed:
                              type: integer
                            triggered:
                              type: integer
                            lastRunAt:
                              type:
                              - string
                              - 'null'
                          required:
                          - completed
                          - failed
                          - triggered
                          - lastRunAt
                      required:
                      - accountId
                      - buttons
                      - createdAt
                      - dmMessage
                      - id
                      - isActive
                      - name
                      - platform
                      - publishedVersionId
                      - target
                      - triggers
                      - updatedAt
                      - stats
                  cursor:
                    description: Cursor for the next page. Absent when there are no more DM automations.
                    type: string
                required:
                - items
        '404':
          description: Not found
          content:
            application/json:
              schema:
                description: Not found
                type: object
                properties:
                  code:
                    type: number
                  reqId:
                    description: Request ID for tracking
                    type: string
                  message:
                    description: Resource not found
                    type: string
                  action:
                    description: Action to take to resolve the error
                    type: string
                  details:
                    description: Additional structured details about the error
                    type: object
                    additionalProperties: {}
                required:
                - message
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
