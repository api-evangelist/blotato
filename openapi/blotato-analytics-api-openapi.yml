  /v2/analytics/summary:
    get:
      summary: Get analytics summary
      tags:
      - Analytics
      description: Returns published and failed post counts (in total, per platform, and per time bucket) and metric totals for the user's posts published in the given time range.
      parameters:
      - schema:
          type: string
        in: query
        name: since
        required: false
        description: Only include posts published on or after this ISO 8601 timestamp. Defaults to 30 days ago.
      - schema:
          type: string
        in: query
        name: until
        required: false
        description: Only include posts published on or before this ISO 8601 timestamp. Defaults to now.
      - schema:
          type: string
          enum:
          - hour
          - day
        in: query
        name: bucket
        required: false
        description: Size of the time buckets. Defaults to 'hour'.
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishedCount:
                    description: Number of posts published through Blotato in the window.
                    type: integer
                  failedCount:
                    description: Number of posts that failed to publish in the window.
                    type: integer
                  metrics:
                    description: Totals from the latest analytics snapshot of each post published in the window. Null if the user does not have analytics enabled.
                    type:
                    - object
                    - 'null'
                    properties:
                      postsCount:
