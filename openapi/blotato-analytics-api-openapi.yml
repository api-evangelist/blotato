  /v2/analytics/platforms:
    get:
      summary: List performance by platform
      tags:
      - Analytics
      description: Returns engagement and view totals per platform for the user's posts published in the given time range, based on the latest analytics snapshot of each post.
      parameters:
      - schema:
          type: string
        in: query
        name: since
        required: false
        description: Only include posts published on or after this ISO 8601 timestamp. Defaults to 24 hours ago.
      - schema:
          type: string
        in: query
        name: until
        required: false
        description: Only include posts published on or before this ISO 8601 timestamp. Defaults to now.
      - schema:
          type: string
          enum:
          - hour
          - day
        in: query
        name: bucket
        required: false
        description: Size of the time buckets. Defaults to 'hour'.
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    description: One entry per platform with analytics, most engagements first.
                    type: array
                    items:
                      type: object
                      properties:
                        platform:
                          description: Social media platform
                          example: twitter
                          type: string
                          enum:
                          - twitter
                          - instagram
                          - linkedin
                          - facebook
                          - tiktok
                          - pinterest
                          - threads
                          - bluesky
                          - youtube
                          - other
                        postsCount:
                          description: Number of posts published in the window that have analytics.
                          type: integer
                        engagementsCount:
                          description: Sum of likes, comments (or replies), shares, and saves on the latest snapshot of each post.
                          type: string
                        likesCount:
                          description: Sum of likes on the latest snapshot of each post.
                          type: string
                        commentsCount:
                          description: Sum of comments (or replies) on the latest snapshot of each post.
                          type: string
                        viewsCount:
                          description: Sum of views (or impressions) on the latest snapshot of each post. Null if the platform does not report either.
                          type:
                          - string
                          - 'null'
                        buckets:
                          description: Metrics of the posts published in each bucket, oldest first. Buckets without posts are omitted.
                          type: array
                          items:
                            type: object
                            properties:
                              start:
                                description: ISO 8601 start of the bucket (UTC).
                                type: string
                              engagementsCount:
                                type: string
                              likesCount:
                                type: string
                              commentsCount:
                                type: string
                              viewsCount:
                                type:
                                - string
                                - 'null'
                            required:
                            - start
                            - engagementsCount
                            - likesCount
                            - commentsCount
                            - viewsCount
                      required:
                      - platform
                      - postsCount
                      - engagementsCount
                      - likesCount
                      - commentsCount
                      - viewsCount
                      - buckets
                required:
                - items
