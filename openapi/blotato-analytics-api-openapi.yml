  /v2/analytics:
    get:
      summary: List top performing posts
      tags:
      - Analytics
      description: Returns the user's top performing published posts ordered by the requested metric over the given time range.
      parameters:
      - schema:
          type: string
        in: query
        name: since
        required: false
        description: Only include posts published on or after this ISO 8601 timestamp. Defaults to 30 days ago.
      - schema:
          type: string
        in: query
        name: until
        required: false
        description: Only include posts published on or before this ISO 8601 timestamp. Defaults to now.
      - schema:
          type: string
        in: query
        name: platform
        required: false
      - schema:
          type: string
          enum:
          - likes_count
          - comments_count
          - views_count
          - reach_count
        in: query
        name: sortBy
        required: false
      - schema:
          minimum: 1
          maximum: 100
          default: 20
          type: integer
        in: query
        name: limit
        required: false
