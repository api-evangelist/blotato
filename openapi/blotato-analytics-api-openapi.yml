                        type: integer
                      viewsCount:
                        description: Sum of views (or impressions) on the latest snapshot of each post.
                        type: string
                      likesCount:
                        description: Sum of likes on the latest snapshot of each post.
                        type: string
                      commentsCount:
                        description: Sum of comments (or replies) on the latest snapshot of each post.
                        type: string
                    required:
                    - postsCount
                    - viewsCount
                    - likesCount
                    - commentsCount
                  platforms:
                    description: Published and failed posts per platform, most posts first. Platforms without posts are omitted.
                    type: array
                    items:
                      type: object
                      properties:
                        platform:
                          description: Social media platform
                          example: twitter
                          type: string
                          enum:
                          - twitter
                          - instagram
                          - linkedin
                          - facebook
                          - tiktok
                          - pinterest
                          - threads
                          - bluesky
                          - youtube
                          - other
                        publishedCount:
                          type: integer
                        failedCount:
                          type: integer
                      required:
                      - platform
                      - publishedCount
                      - failedCount
                  buckets:
                    description: Published and failed posts in each bucket, oldest first. Buckets without posts are omitted.
                    type: array
                    items:
                      type: object
                      properties:
                        start:
                          description: ISO 8601 start of the bucket (UTC).
                          type: string
                        publishedCount:
                          type: integer
                        failedCount:
                          type: integer
                      required:
                      - start
                      - publishedCount
                      - failedCount
                required:
                - publishedCount
                - failedCount
                - metrics
                - platforms
