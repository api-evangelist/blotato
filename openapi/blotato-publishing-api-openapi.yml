    post:
      summary: Create a new post
      tags:
      - publishing
      description: '# General


        Creates a new post with the provided content and optional scheduling. The post can be published immediately or scheduled for a later time.


        Every post is scheduled on a queue. Failed posts are available at . The most common issue of failed post is incorrect JSON structure. Please make sure that JSON payload conforms to the structure described above. If you are still having trouble with identifying the issue, please contact support via Intercom and provide your `postSubmissionId`.


        Post creation has a user-level rate limit of **30 requests / minute** to prevent spamming / abusing social media endpoints


        # Examples


        ## Post to a Platform Immediately


        ```

        POST https://backend.blotato.com/v2/posts HTTP/1.1

        Content-Type: application/json

        Headers:


        {

        "post": {

        "accountId": "acc_12345",

        "content": {

        "text": "Hello, world!",

        "mediaUrls": [],

        "platform": "twitter"

        },

        "target": {

        "targetType": "twitter"

        }

        }

        }

        ```


        ## Post at a Scheduled Time


        ```

        POST https://backend.blotato.com/v2/posts HTTP/1.1

        Content-Type: application/json


        {

        "post": {

        "accountId": "acc_67890",

        "content": {

        "text": "Scheduled post example",

        "mediaUrls": [],

        "platform": "facebook"

        },

        "target": {

        "targetType": "facebook",

        "pageId": "987654321"

        }

        },

        "scheduledTime": "2025-03-10T15:30:00Z"

        }

        ```


        ## Post an Image or a Video


        ```

        POST https://backend.blotato.com/v2/posts HTTP/1.1

        Content-Type: application/json


        {

        "post": {

        "accountId": "acc_24680",

        "content": {

        "text": "Check out this image!",

        "mediaUrls": [

        "https://example.com/image1.jpg",

        "https://example.com/image2.jpg"

        ],

        "platform": "instagram"

        },

        "target": {

        "targetType": "instagram"

        }

        }

        }

        ```


        ## Post a Twitter-like Thread with Multiple Posts


        ```

        POST https://backend.blotato.com/v2/posts HTTP/1.1

        Content-Type: application/json

        Headers:


        POST https://backend.blotato.com/v2/posts HTTP/1.1

        Content-Type: application/json


        {

        "post": {

        "accountId": "acc_13579",

        "content": {

        "text": "This is the first tweet in the thread.",

        "mediaUrls": [],

        "platform": "twitter",

        "additionalPosts": [

        {

        "text": "Here''s the second tweet, adding more info.",

        "mediaUrls": []

        },

        {

        "text": "And here''s the third tweet to conclude!",

        "mediaUrls": []

        }

        ]

        },

        "target": {

        "targetType": "twitter"

        }

        }

        }

        ```'
