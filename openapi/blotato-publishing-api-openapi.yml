openapi: 3.2.0
info:
  title: Blotato Publishing API
  description: Blotato API documentation
  version: 2.0.0
servers:
- url: https://backend.blotato.com
  description: Blotato API Server
tags:
- name: publishing
  description: Endpoints related to publishing content, such as posts and drafts.
paths:
  /v2/media:
    post:
      summary: Upload media from URL
      tags:
      - publishing
      description: '# General


        This endpoint allows users to upload media by providing a URL. The uploaded media will be processed and stored, returning a new media URL that is used to publish a new post. Most of the platforms require validated URLs for posting images.


        You can upload:


        - publicly accessible URLs


        - _base64_ encoded image data


        Media uploads are limited to 1GB file size or smaller.


        Media upload has a user-level rate limit of **10 requests / minute**.


        # Upload Google Drive


        If you have a link in google drive like this:


        You can use the following link for your Blotato "upload media" API call:


        Note how the IDs match: `18-UgDEaKG7YR7AewIDd_Qi4QCLCX5Kop`


        To see examples of how to upload to Blotato from a Google Drive, you can also check out these tutorials and templates:


        n8n:


        make:


        # Seeing error "Google Drive can''t scan this file for viruses"?


        This is the **most common issue** when using Google Drive. When you try to access your file, you see this popup "Google Drive can''t scan this file for viruses".


        The issue is when you host a large video on google drive, it will show this popup, which prevents Blotato from accessing the video.


        Recommended workaround: if you''re regularly posting large videos (100MB+), I recommend using frame.io, an AWS S3 bucket, or similar tool where there is no issue passing around large video files.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              errorMessage:
                required:
                  url: '"url" is missing. Add it as a top-level property with the public URL of the media to upload.'
              type: object
              properties:
                url:
                  description: The URL of the media to upload.
                  example: https://example.com/image.jpg
                  type: string
              required:
              - url
      security:
      - apiKey: []
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    description: Uploaded and validated blotato media URL.
                    example: https://database.blotato.io/media/12345.jpg
                    type: string
                  id:
                    description: The internal ID of the uploaded media.
                    example: media_12345
                    type: string
                required:
                - url
                - id
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                description: Forbidden
                type: object
                properties:
                  code:
                    type: number
                  reqId:
                    description: Request ID for tracking
                    type: string
                  message:
                    description: Forbidden access
                    type: string
                  subscriptionStatus:
                    description: Current subscription plan status
                    type: string
                  action:
                    description: Action to take to resolve the error
                    type: string
                  details:
                    description: Additional structured details about the error
                    type: object
                    additionalProperties: {}
                required:
                - message
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                description: Validation error
                type: object
                properties:
                  code:
                    type: number
                  reqId:
                    description: Request ID for tracking
                    type: string
                  message:
                    description: Validation error
                    type: string
                  action:
                    description: Action to take to resolve the error
                    type: string
                  details:
                    description: Additional structured details about the error
                    type: object
                    additionalProperties: {}
                required:
                - message
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                description: Rate limit exceeded
                type: object
                properties:
                  code:
                    type: number
                  reqId:
                    description: Request ID for tracking
                    type: string
                  message:
                    description: Rate limit exceeded
                    type: string
                  action:
                    description: Action to take to resolve the error
                    type: string
                  details:
                    description: Additional structured details about the error
                    type: object
                    additionalProperties: {}
                required:
                - message
        '500':
          description: Server error
          content:
            application/json:
              schema:
                description: Server error
                type: object
                properties:
                  code:
                    type: number
                  reqId:
                    description: Request ID for tracking
                    type: string
                  message:
                    description: An error occurred
                    type: string
                  action:
                    description: Action to take to resolve the error
                    type: string
                  details:
                    description: Additional structured details about the error
                    type: object
                    additionalProperties: {}
                required:
                - message
      operationId: postV2Media
      x-operation-id-source: derived
  /v2/media/uploads:
    post:
      summary: Create presigned upload URL
      tags:
      - publishing
      description: Creates a presigned URL for direct file upload. Use this when you have a local file to upload rather than a publicly accessible URL. The returned `presignedUrl` accepts a PUT request with the file body, and `publicUrl` is the final media URL to use when publishing a post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  description: The filename including extension, used to determine content type.
                  example: my-video.mp4
                  type: string
              required:
              - filename
      security:
      - apiKey: []
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  presignedUrl:
                    description: URL to PUT the file to. Expires after a short period.
                    type: string
                  publicUrl:
                    description: The final public URL of the uploaded media, to be used when creating a post.
                    type: string
                required:
                - presignedUrl
                - publicUrl
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                description: Forbidden
                type: object
                properties:
                  code:
                    type: number
                  reqId:
                    description: Request ID for tracking
                    type: string
                  message:
                    description: Forbidden access
                    type: string
                  subscriptionStatus:
                    description: Current subscription plan status
                    type: string
                  action:
                    description: Action to take to resolve the error
                    type: string
                  details:
                    description: Additional structured details about the error
                    type: object
                    additionalProperties: {}
                required:
                - message
        '500':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: number
                  action:
                    description: Action to take to resolve the error
                    type: string
                  details:
                    description: Additional structured details about the error
                    type: object
                    additionalProperties: {}
                required:
                - message
      operationId: postV2MediaUploads
      x-operation-id-source: derived
  /v2/posts:
    get:
      summary: List posts
      tags:
      - publishing
      description: Lists the current user's posts (scheduled, published, and failed) within a time window, ordered by post time (most recent first). Supports cursor-based pagination and filtering by status and platform. Post listing has a user-level rate limit of **60 requests / minute**.
      parameters:
      - schema:
          example: '2026-10-12T18:31:58.390Z'
          type: string
        in: query
        name: since
        required: false
        description: Only include posts whose post time is on or after this ISO 8601 timestamp. Defaults to 7 days ago.
      - schema:
          example: '2026-10-26T18:31:58.390Z'
          type: string
        in: query
        name: until
        required: false
        description: Only include posts whose post time is on or before this ISO 8601 timestamp. Defaults to 7 days from now.
      - schema:
          minimum: 1
          maximum: 250
          default: 50
          type: integer
        in: query
        name: limit
        required: false
        description: Maximum number of posts to return. Defaults to 50.
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Opaque cursor returned by a previous call. Pass it to fetch the next page.
      - schema:
          type: array
          items:
            type: string
            enum:
            - scheduled
            - published
            - failed
        example:
        - scheduled
        - published
        in: query
        name: status
        required: false
        description: Filter posts by status. Pass multiple values to include any of them. Omit to include all statuses.
      - schema:
          type: array
          items:
            description: Social media platform
            example: twitter
            type: string
            enum:
            - twitter
            - instagram
            - linkedin
            - facebook
            - tiktok
            - pinterest
            - threads
            - bluesky
            - youtube
            - other
        example:
        - twitter
        - instagram
        in: query
        name: platform
        required: false
        description: Filter posts by social media platform. Pass multiple values to include any of them. Omit to include all platforms.
      - schema:
          type: string
          enum:
          - blotato
          - all
        in: query
        name: source
        required: false
        description: 'Which published posts to include: ''blotato'' (default) returns only posts published through Blotato; ''all'' also includes any externally-published posts that were brought into Blotato.'
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    description: List of posts
                    type: array
                    items:
                      allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                          postTime:
                            type: string
                          account:
                            description: The connected account the post targets. Null if the account is no longer connected.
                            type:
                            - object
                            - 'null'
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              subaccount:
                                type:
                                - object
                                - 'null'
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
                                required:
                                - id
                                - name
                            required:
                            - id
                            - name
                            - subaccount
                          state:
                            type: object
                            discriminator:
                              propertyName: type
                            oneOf:
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - scheduled
                              required:
                              - type
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - published
                                postUrl:
                                  type:
                                  - string
                                  - 'null'
                                analytics:
