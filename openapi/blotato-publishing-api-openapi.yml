  /v2/published-posts/{id}:
    get:
      summary: Get a published post by ID
      tags:
      - publishing
      description: Fetches a published post by its ID, including the original publish payload for posts published through Blotato.
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
      security:
      - apiKey: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishedPost:
                    type: object
                    properties:
                      id:
                        type: string
                      platform:
                        description: Social media platform
                        example: twitter
                        type: string
                        enum:
                        - twitter
                        - instagram
                        - linkedin
                        - facebook
                        - tiktok
                        - pinterest
                        - threads
                        - bluesky
                        - youtube
                        - other
                      content:
                        type: string
                      mediaUrls:
                        type: array
                        items:
                          type: string
                      postUrl:
                        type:
                        - string
                        - 'null'
                      createdAt:
                        type: string
                      rawPost:
                        type:
                        - object
                        - 'null'
                        properties:
                          accountId:
                            description: The ID of the social media account to publish the content to.
                            example: '1'
                            type: string
                          content:
                            type: object
                            allOf:
                            - type: object
                              properties:
                                text:
                                  description: The text content of the post.
                                  example: My text
                                  type: string
                                mediaUrls:
                                  description: List of media URLs to include in the post.
                                  maxItems: 20
                                  type: array
                                  items:
                                    description: URLs of media files (images, videos) to include in the post. Must originate from the blotato domain. Use the media upload endpoint to upload media files before publishing.
                                    example: https://database.blotato.io/some-image-path.jpg
                                    type: string
                              required:
                              - text
                              - mediaUrls
                            - type: object
                              properties:
                                platform:
                                  description: Social media platform
                                  example: twitter
                                  type: string
                                  enum:
                                  - twitter
                                  - instagram
                                  - linkedin
                                  - facebook
                                  - tiktok
                                  - pinterest
                                  - threads
                                  - bluesky
                                  - youtube
                                  - other
                                additionalPosts:
                                  maxItems: 10
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      text:
                                        description: The text content of the post.
                                        example: My text
                                        type: string
                                      mediaUrls:
                                        description: List of media URLs to include in the post.
                                        maxItems: 20
                                        type: array
                                        items:
                                          description: URLs of media files (images, videos) to include in the post. Must originate from the blotato domain. Use the media upload endpoint to upload media files before publishing.
                                          example: https://database.blotato.io/some-image-path.jpg
                                          type: string
                                    required:
                                    - text
                                    - mediaUrls
                              required:
                              - platform
                          target:
                            type: object
                            discriminator:
                              propertyName: targetType
                            oneOf:
                            - type: object
                              properties:
                                targetType:
                                  description: Publish to a custom webhook.
                                  example: webhook
                                  type: string
                                  enum:
                                  - webhook
                                url:
                                  minLength: 1
                                  description: The URL of the webhook to publish to.
                                  example: https://example.com/webhook
                                  type: string
                              required:
                              - targetType
                              - url
                            - type: object
                              properties:
                                targetType:
                                  description: Publish to Twitter.
                                  example: twitter
                                  type: string
                                  enum:
                                  - twitter
                              required:
                              - targetType
                            - type: object
                              properties:
                                targetType:
                                  description: Publish to LinkedIn.
                                  example: linkedin
                                  type: string
                                  enum:
                                  - linkedin
                                pageId:
                                  minLength: 1
                                  description: The ID of the LinkedIn page to publish to.
                                  example: '123456789'
                                  type: string
                              required:
                              - targetType
                            - type: object
                              properties:
                                targetType:
                                  description: Publish to Facebook.
                                  example: facebook
                                  type: string
                                  enum:
                                  - facebook
                                pageId:
                                  pattern: ^\d+$
                                  description: The ID of the Facebook page to publish to.
                                  example: '123456789'
                                  type: string
                                mediaType:
                                  description: Whether the media is a reel or video.
                                  example: reel
                                  type: string
                                  enum:
                                  - reel
                                  - story
                                link:
                                  minLength: 1
                                  description: Link preview to attach to the Facebook post.
                                  example: https://blotato.com
                                  type: string
                                firstComment:
                                  minLength: 1
                                  maxLength: 8000
                                  description: Auto-posted comment on posts and reels, immediately after publish. Not supported for stories.
                                  example: First comment!
                                  type: string
                              required:
                              - targetType
                              - pageId
                            - type: object
                              properties:
                                targetType:
                                  description: Publish to Instagram.
                                  example: instagram
                                  type: string
                                  enum:
                                  - instagram
                                mediaType:
                                  description: Whether the media is a reel or story.
                                  example: reel
                                  type: string
                                  enum:
                                  - reel
                                  - story
                                altText:
                                  minLength: 1
                                  maxLength: 1000
                                  description: Alternative text, for accessibility purposes. Only supported on a single image or image media in a carousel.
                                  example: Describe the image here for accessibility
                                  type: string
                                shareToFeed:
                                  description: Whether to also share the reel to the Instagram feed. Only applicable for reels.
                                  example: false
                                  type: boolean
                                audioName:
                                  minLength: 1
                                  maxLength: 2200
