                      quickReplies:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              minLength: 1
                              maxLength: 20
                              description: Chip label shown to the recipient.
                              type: string
                            payload:
                              minLength: 1
                              maxLength: 1000
                              description: Message replied with on chip selection.
                              type: string
                          required:
                          - title
                          - payload
                      selection:
                        type: object
                        properties:
                          payload:
                            type:
                            - string
                            - 'null'
                          type:
                            type: string
                            enum:
                            - postback
                            - quick-reply
                        required:
                        - payload
                        - type
                  platform:
                    type: string
                    enum:
                    - facebook
                    - instagram
                  recipientId:
                    type: string
                  senderId:
                    type:
                    - string
                    - 'null'
                  status:
                    type: string
                    enum:
                    - delivered
                    - failed
                    - processing
                    - queued
                    - sent
                  text:
                    type: string
                required:
                - conversationId
                - createdAt
                - direction
                - errorCode
                - errorMessage
                - id
                - platform
                - recipientId
                - senderId
                - status
                - text
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                description: Forbidden
                type: object
                properties:
                  code:
                    type: number
                  reqId:
                    description: Request ID for tracking
                    type: string
                  message:
                    description: Forbidden access
                    type: string
                  subscriptionStatus:
                    description: Current subscription plan status
                    type: string
                  action:
                    description: Action to take to resolve the error
                    type: string
                  details:
                    description: Additional structured details about the error
                    type: object
                    additionalProperties: {}
                required:
                - message
        '404':
          description: Not found
          content:
            application/json:
              schema:
                description: Not found
                type: object
                properties:
                  code:
                    type: number
                  reqId:
                    description: Request ID for tracking
                    type: string
                  message:
                    description: Resource not found
